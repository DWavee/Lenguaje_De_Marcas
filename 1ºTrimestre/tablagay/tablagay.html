<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLA GAY UwU</title>
    <link rel="stylesheet" href="tablagay.css"
</head>
<body>
    <table>
        <caption><h1>HORARIO GAY</h1></caption>
        <thead>
            <tr>
                <th id="c1" scope="col">Hora</th>
                <th id="c2" scope="col">Lunes</th>
                <th id="c3" scope="col">Martes</th>
                <th id="c4" scope="col">Miércoles</th>
                <th id="c5" scope="col">Jueves</th>
                <th id="c6" scope="col">Viernes</th>
            </tr>
        </thead>
        <tbody>
            <tr id="b1">
                <th scope="row">8:00/9:00</th>
                <th rowspan="2">PROG</th>
                <th>SSII</th>
                <th rowspan="3">PROG</th>
                <th rowspan="2">SSII</th>
                <th rowspan="3">PROG</th>
            </tr>
            <tr id="b1">
                <th scope="row">9:00/10:00</th>
                <th rowspan="2">LMSGI</th>
            </tr>
            <tr id="b1">
                <th scope="row">10:00/11:00</th>
                <th>SSII</th>
                <th>BBDD</th>
            </tr>
            <tr id="b2">
                <th scope="row">11:00/11:30</th>
                <th colspan="5">RECREO</th>
            </tr>
            <tr id="b1">
                <th scope="row">11:30/12:30</th>
                <th>SSII</th>
                <th>LMSGI</th>
                <th rowspan="2">EDES</th>
                <th>BBDD</th>
                <th>EDES</th>
            </tr>
            <tr id="b1">
                <th scope="row">12:30/13:30</th>
                <th rowspan="2">BBDD</th>
                <th>SASP</th>
                <th rowspan="2">IPE</th>
                <th rowspan="2">BBDD</th>
            </tr>
            <tr id="b1">
                <th scope="row">13:30/14:30</th>
                <th>DIG</th>
                <th>IPE</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
